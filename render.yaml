databases:
  - name: bookai-postgres
    databaseName: bookai
    user: bookai
    plan: free

services:
  - type: web
    name: bookai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bookai-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: CORS_ORIGIN_REGEX
        value: https://.*\\.onrender\\.com
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: bookai-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run preview -- --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: VITE_API_BASE
        value: https://bookai-backend.onrender.com/api
